name: apply boss flow polish

on:
  push:
    branches:
      - work/boss-flow-polish-20260829
    paths:
      - .github/workflows/apply-boss-flow-polish.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: work/boss-flow-polish-20260829
          persist-credentials: true
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded source patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime_path = Path('src/core/GameRuntime.ts')
          lines = runtime_path.read_text().splitlines()

          def find_unique(stripped: str) -> int:
              hits = [index for index, line in enumerate(lines) if line.strip() == stripped]
              if len(hits) != 1:
                  raise SystemExit(f'target {stripped!r} matched {len(hits)} times')
              return hits[0]

          signature = find_unique('private maybeSpawnBoss(force = false): void {')
          lines[signature] = lines[signature].replace('maybeSpawnBoss(force = false)', 'maybeSpawnBoss()')

          guard = find_unique('if (!force && !this.runDirector.shouldSpawnBoss(depthRatio, state.elapsedSeconds)) return;')
          lines[guard] = lines[guard].replace('if (!force && ', 'if (')

          bypass = find_unique('} else if (!run.bossActive && !run.bossDefeated) {')
          if lines[bypass + 1].strip() != 'this.maybeSpawnBoss(true);' or lines[bypass + 2].strip() != '} else {':
              raise SystemExit('goal boss bypass block shape changed')
          indent = lines[bypass][:len(lines[bypass]) - len(lines[bypass].lstrip())]
          lines[bypass] = indent + '} else {'
          del lines[bypass + 1:bypass + 3]

          goal_message_hits = [
              index for index, line in enumerate(lines)
              if 'this.setMessage(`GOAL LOCK · 破壊 ' in line
          ]
          if len(goal_message_hits) != 1:
              raise SystemExit(f'goal lock message matched {len(goal_message_hits)} times')
          goal_message = goal_message_hits[0]
          message_indent = lines[goal_message][:len(lines[goal_message]) - len(lines[goal_message].lstrip())]
          lines[goal_message] = message_indent + 'this.setMessage(`GOAL LOCK · 破壊 ${state.destroyed}/${GAME_CONFIG.goal.requiredDestroyed} · 撃破 ${state.enemiesDefeated}/${GAME_CONFIG.goal.requiredEnemiesDefeated}${run.bossActive ? " · BOSS ACTIVE" : run.bossDefeated ? "" : " · BOSS LOCK · RUN LVを上げて深度72%へ"}`);'

          runtime_path.write_text('\n'.join(lines) + '\n')

          tests_path = Path('tests/runtime-contracts.test.ts')
          tests = tests_path.read_text()
          boss_title = 'EnemyManager recycles a defeated boss slot back into the reinforcement pool'
          gate_title = 'goal contact cannot bypass the RunDirector boss progression gate'
          if boss_title in tests or gate_title in tests:
              raise SystemExit('boss flow regression tests already exist')

          tests += '''\n\ntest("EnemyManager recycles a defeated boss slot back into the reinforcement pool", () => {
            const world = new VoxelWorld();
            const scene = new THREE.Scene();
            const player = new THREE.Group();
            player.position.set(world.spawnPoint.x, world.spawnPoint.y, world.spawnPoint.z);
            const manager = new EnemyManager(scene, world, {
              onPlayerContact: () => undefined,
              onEnemyDamaged: () => undefined,
            });
            manager.reset();
            manager.setDanger(2, 5);
            const boss = manager.spawnBoss(world.goalPoint.clone(), 5);
            assert.ok(boss);
            if (!boss) throw new Error("boss slot was unavailable");
            const result = manager.damage(boss, player.position, boss.mesh.position.clone(), boss.maxHp + 10, 1);
            assert.equal(result?.defeated, true);
            assert.equal(result?.boss, true);
            assert.equal(boss.boss, false);
            assert.notEqual(boss.type, "boss");
            assert.equal(boss.mesh.visible, false);
            manager.update(4, player);
            assert.ok(manager.activeCount >= 7);
            manager.dispose();
            world.dispose();
          });

          test("goal contact cannot bypass the RunDirector boss progression gate", () => {
            const runtime = readFileSync(new URL("../src/core/GameRuntime.ts", import.meta.url), "utf8");
            assert.doesNotMatch(runtime, /maybeSpawnBoss\\(true\\)/);
            assert.doesNotMatch(runtime, /maybeSpawnBoss\\(force/);
            assert.match(runtime, /BOSS LOCK/);
          });\n'''
          tests_path.write_text(tests)
          PY
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Runtime contracts
        run: node --import tsx tests/runtime-contracts.test.ts
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src/core/GameRuntime.ts tests/runtime-contracts.test.ts
          git diff --cached --check
          git commit -m "fix: enforce boss progression gate"
          git push origin HEAD:work/boss-flow-polish-20260829
