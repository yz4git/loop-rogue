name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            tests/game-rules.test.ts
            tests/architecture-contracts.test.ts
            tests/runtime-contracts.test.ts
            tests/camera-contracts.test.ts
            tests/canvas3d-preview.test.ts
            tests/rendered-html.test.mjs
          )
          for test_file in "${tests[@]}"; do
            echo "::group::${test_file}"
            timeout --signal=TERM --kill-after=5s 60s \
              node --test-force-exit --import tsx --test "${test_file}"
            echo "::endgroup::"
          done
      - name: Worldgen smoke test
        run: timeout --signal=TERM --kill-after=5s 90s npm run test:worldgen
      - name: Lint
        run: npm run lint
