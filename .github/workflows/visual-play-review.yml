name: visual play review

on:
  push:
    branches:
      - work/visual-play-review-20260830
    paths:
      - .github/workflows/visual-play-review.yml

permissions:
  contents: read

jobs:
  play-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: work/visual-play-review-20260830
          persist-credentials: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install app and browser
        run: |
          npm ci
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start game
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/loop-rogue-vite.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/loop-rogue-vite.log
          exit 1
      - name: Capture active gameplay
        shell: bash
        run: |
          cat > visual-play-active.mjs <<'JS'
          import fs from 'node:fs';
          import { chromium } from 'playwright';

          fs.mkdirSync('visual-active', { recursive: true });
          const browser = await chromium.launch({ headless: true, args: [
            '--use-angle=swiftshader', '--enable-webgl', '--ignore-gpu-blocklist', '--disable-dev-shm-usage',
          ]});
          const context = await browser.newContext({
            viewport: { width: 844, height: 390 }, deviceScaleFactor: 2,
            isMobile: true, hasTouch: true,
            userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1',
          });
          const page = await context.newPage();
          const errors = [];
          page.on('pageerror', e => errors.push(String(e)));

          async function shot(name) {
            const text = await page.locator('body').innerText();
            fs.writeFileSync(`visual-active/${name}.txt`, text);
            await page.screenshot({ path: `visual-active/${name}.png`, fullPage: true });
          }
          async function choose() {
            const card = page.locator('.upgrade-card').first();
            if (await card.isVisible().catch(() => false)) {
              await card.click({ force: true, timeout: 1500 }).catch(() => {});
              await page.waitForTimeout(180);
            }
          }
          async function advance(count, label) {
            await page.keyboard.down('KeyW');
            for (let i = 0; i < count; i++) {
              await page.keyboard.press('KeyF');
              await page.waitForTimeout(190);
              await choose();
            }
            await page.keyboard.up('KeyW');
            await page.waitForTimeout(250);
            await shot(label);
          }

          await page.goto('http://127.0.0.1:4173/?visual-active=1', { waitUntil: 'domcontentloaded', timeout: 90000 });
          await page.waitForSelector('.punch-button', { timeout: 90000 });
          await page.waitForTimeout(3500);
          await shot('00-start');

          await page.keyboard.down('KeyW');
          await page.waitForTimeout(900);
          await page.keyboard.up('KeyW');
          await page.keyboard.press('KeyF');
          await page.waitForTimeout(55);
          await shot('01-punch-impact');
          await page.waitForTimeout(260);

          await page.keyboard.press('Space');
          await page.waitForTimeout(150);
          await page.keyboard.press('KeyF');
          await page.waitForTimeout(420);
          await choose();
          await shot('02-after-ground-break');

          await advance(5, '03-active-5');
          await advance(5, '04-active-10');
          await advance(6, '05-active-16');
          await advance(6, '06-active-22');

          fs.writeFileSync('visual-active/errors.json', JSON.stringify(errors, null, 2));
          await browser.close();
          JS
          node visual-play-active.mjs
      - name: Upload active review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: loop-rogue-visual-active-review
          path: visual-active
          if-no-files-found: warn
          retention-days: 3
