name: apply post review structural polish

on:
  push:
    branches:
      - work/five-minute-visual-improve-20260830
    paths:
      - .github/workflows/apply-post-review-structural.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/five-minute-visual-improve-20260830
          persist-credentials: true
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def one(path, old, new):
              p=Path(path); text=p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one match, got {text.count(old)}: {old[:100]!r}')
              p.write_text(text.replace(old,new,1))

          one('src/core/Settings.ts', '    punchRange: 2.85,', '    punchRange: 3.15,')

          old_contact='''        if (enemy.hitCooldown <= 0 && this.playerContactCooldown <= 0) {
          enemy.hitCooldown = enemy.boss ? 0.82 : GAME_CONFIG.enemies.contactCooldown;
          this.playerContactCooldown = enemy.boss ? 0.8 : 1.35;
          const damage = enemy.boss ? 2 : enemy.type === "brute" ? 2 : 1;
          this.callbacks.onPlayerContact(enemy.mesh.position, damage);
          if ((enemy.boss || enemy.type === "bomber") && enemy.terrainCooldown <= 0) {
            enemy.terrainCooldown = enemy.boss ? 1.35 : 2.4;
            this.callbacks.onEnemyTerrainImpact?.(enemy.mesh.position.clone(), enemy.boss ? 2.25 : 1.35, enemy.boss ? 2 : 1);
          }
        }'''
          new_contact='''        if (enemy.hitCooldown <= 0 && this.playerContactCooldown <= 0) {
          enemy.hitCooldown = enemy.boss ? 1.1 : enemy.type === "brute" ? 1.8 : 1.65;
          this.playerContactCooldown = enemy.boss ? 0.8 : 1.35;
          const damage = enemy.boss ? 2 : enemy.type === "brute" ? 2 : 1;
          this.callbacks.onPlayerContact(enemy.mesh.position, damage);
          if (distance > 0.01) {
            const recoil = enemy.boss ? 0.55 : enemy.type === "brute" ? 0.82 : 1.15;
            const retreat = this.alternate.copy(enemy.mesh.position).addScaledVector(toPlayer, -recoil / distance);
            const radius = enemy.boss ? 0.68 : 0.32;
            const height = enemy.boss ? 1.45 : 0.8;
            if (!this.world.collidesAabb(retreat, radius, height)) enemy.mesh.position.copy(retreat);
          }
          if ((enemy.boss || enemy.type === "bomber") && enemy.terrainCooldown <= 0) {
            enemy.terrainCooldown = enemy.boss ? 1.35 : 2.4;
            this.callbacks.onEnemyTerrainImpact?.(enemy.mesh.position.clone(), enemy.boss ? 2.25 : 1.35, enemy.boss ? 2 : 1);
          }
        }'''
          one('src/enemies/EnemyManager.ts', old_contact, new_contact)

          one('src/camera/CameraController.ts', '  private readonly direction = new THREE.Vector3();', '  private readonly direction = new THREE.Vector3();\n  private readonly firstPersonLook = new THREE.Vector3();')
          old_camera='''    this.logicalPosition.copy(this.target).addScaledVector(this.direction, this.actualDistance);
    const followAlpha = 1 - Math.exp(-GAME_CONFIG.camera.followSpeed * delta);
    this.smoothedPosition.lerp(this.logicalPosition, followAlpha);
    this.camera.position.copy(this.smoothedPosition);

    if (now < this.shakeUntil) {
      const falloff = Math.min(1, (this.shakeUntil - now) / 180);
      this.camera.position.x += Math.sin(now * 0.11) * this.shakeStrength * falloff;
      this.camera.position.y += Math.cos(now * 0.14) * this.shakeStrength * falloff;
    } else {
      this.shakeStrength = 0;
    }
    this.camera.lookAt(this.target);'''
          new_camera='''    const closeView = this.actualDistance < 1.2;
    if (closeView) {
      this.camera.position.copy(playerPosition);
      this.camera.position.y += 1.12;
      this.smoothedPosition.copy(this.camera.position);
    } else {
      this.logicalPosition.copy(this.target).addScaledVector(this.direction, this.actualDistance);
      const followAlpha = 1 - Math.exp(-GAME_CONFIG.camera.followSpeed * delta);
      this.smoothedPosition.lerp(this.logicalPosition, followAlpha);
      this.camera.position.copy(this.smoothedPosition);
    }

    if (now < this.shakeUntil) {
      const falloff = Math.min(1, (this.shakeUntil - now) / 180);
      this.camera.position.x += Math.sin(now * 0.11) * this.shakeStrength * falloff;
      this.camera.position.y += Math.cos(now * 0.14) * this.shakeStrength * falloff;
    } else {
      this.shakeStrength = 0;
    }
    if (closeView) {
      this.firstPersonLook.copy(this.camera.position).addScaledVector(this.direction, -8);
      this.camera.lookAt(this.firstPersonLook);
    } else {
      this.camera.lookAt(this.target);
    }'''
          one('src/camera/CameraController.ts', old_camera, new_camera)

          tests=Path('tests/runtime-contracts.test.ts'); text=tests.read_text()
          if 'contact attacks recoil before re-engaging' not in text:
              text += '''\n\ntest("contact attacks recoil before re-engaging and tight camera becomes true first person", () => {\n  const enemy = readFileSync(new URL("../src/enemies/EnemyManager.ts", import.meta.url), "utf8");\n  const camera = readFileSync(new URL("../src/camera/CameraController.ts", import.meta.url), "utf8");\n  assert.match(enemy, /recoil/);\n  assert.match(enemy, /1\\.65/);\n  assert.match(camera, /closeView/);\n  assert.match(camera, /firstPersonLook/);\n  assert.match(camera, /addScaledVector\\(this\\.direction, -8\\)/);\n});\n'''
              tests.write_text(text)
          PY
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Tests
        run: bash scripts/run-tests.sh
      - name: Lint
        run: npm run lint
      - name: Commit and push safely
        shell: bash
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src tests
          git diff --cached --check
          git commit -m "fix: add tight-space combat recovery and first-person camera"
          git fetch origin work/five-minute-visual-improve-20260830
          git rebase origin/work/five-minute-visual-improve-20260830
          git push origin HEAD:work/five-minute-visual-improve-20260830
