name: apply post review structural polish

on:
  push:
    branches:
      - work/five-minute-visual-improve-20260830
    paths:
      - .github/workflows/apply-post-review-structural.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/five-minute-visual-improve-20260830
          persist-credentials: true
          fetch-depth: 20
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Patch
        run: python scripts/apply-post-review-structural.py
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Tests
        run: bash scripts/run-tests.sh
      - name: Lint
        run: npm run lint
      - name: Commit and push safely
        shell: bash
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src tests
          git diff --cached --check
          git commit -m "fix: add tight-space combat recovery and first-person camera"
          git fetch origin work/five-minute-visual-improve-20260830
          git rebase origin/work/five-minute-visual-improve-20260830
          git push origin HEAD:work/five-minute-visual-improve-20260830
