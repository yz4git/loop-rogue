name: apply five minute gameplay improvements

on:
  push:
    branches:
      - work/five-minute-visual-improve-20260830
    paths:
      - .github/workflows/apply-five-minute-improvements.yml

permissions:
  contents: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/five-minute-visual-improve-20260830
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply review polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_if(path, old, new):
              p=Path(path); text=p.read_text()
              if new in text: return
              if old not in text: raise SystemExit(f'{path}: missing replacement target {old[:80]!r}')
              p.write_text(text.replace(old,new,1))

          replace_if('src/enemies/EnemyManager.ts', 'this.playerContactCooldown = enemy.boss ? 0.7 : 1.15;', 'this.playerContactCooldown = enemy.boss ? 0.8 : 1.35;')
          replace_if('src/core/GameRuntime.ts', 'this.player.position.addScaledVector(knockback.normalize(), 0.4);', 'this.player.position.addScaledVector(knockback.normalize(), 0.58);')
          replace_if('src/core/GameRuntime.ts', '  get breakVisualStrength(): number { return this.runDirector.getBreakVisualStrength(); }', '  get breakVisualStrength(): number { return this.runDirector.getBreakVisualStrength(); }\n  get cameraDistance(): number { return this.cameraController.distance; }')
          replace_if('src/core/VoxelDemo.ts', '    this.player.visible = true;\n    this.updatePlayerAnimation(now);', '    this.player.visible = this.runtime.cameraDistance >= 1.2;\n    this.updatePlayerAnimation(now);')
          replace_if('src/game/RunDirector.ts', '  targetSeconds: number;\n  pace: number;', '  targetSeconds: number;\n  pace: number;\n  maxDepthPercent: number;')
          replace_if('src/game/RunDirector.ts', '      targetSeconds: GAME_CONFIG.run.targetSeconds,\n      pace: Math.round(this.pace * 100),', '      targetSeconds: GAME_CONFIG.run.targetSeconds,\n      pace: Math.round(this.pace * 100),\n      maxDepthPercent: Math.round(this.maxDepth * 100),')
          replace_if('src/ui/GameViewState.ts', '  runPace: number;\n  targetSeconds: number;', '  runPace: number;\n  runMaxDepth: number;\n  targetSeconds: number;')
          replace_if('src/core/GameRuntime.ts', '      runPace: run.pace,\n      targetSeconds: run.targetSeconds,', '      runPace: run.pace,\n      runMaxDepth: run.maxDepthPercent,\n      targetSeconds: run.targetSeconds,')
          replace_if('app/page.tsx', '  hp: 12,\n  maxHp: 12,\n  enemies: 6,', '  hp: 16,\n  maxHp: 16,\n  enemies: 3,')
          replace_if('app/page.tsx', '  nextUpgradeXp: 90,', '  nextUpgradeXp: 150,')
          replace_if('app/page.tsx', '  runPace: 0,\n  targetSeconds: 600,', '  runPace: 0,\n  runMaxDepth: 0,\n  targetSeconds: 300,')
          replace_if('app/page.tsx', '    <main className={`demo-shell ${stats.breakMode ? "break-active" : ""}`}', '    <main className={`demo-shell ${stats.breakMode ? "break-active" : ""} ${stats.status !== "playing" ? "run-ended" : ""}`}')
          replace_if('app/page.tsx', ': `到達DEPTH ${stats.runPace}%`}', ': `到達DEPTH ${stats.runMaxDepth}%`}')

          css=Path('app/globals.css'); text=css.read_text()
          if '.run-ended .virtual-joystick' not in text:
              css.write_text(text+'\n\n.run-ended .virtual-joystick,\n.run-ended .punch-button,\n.run-ended .jump-button {\n  opacity: 0;\n  pointer-events: none;\n  transform: scale(0.92);\n}\n')

          readme=Path('README.md'); text=readme.read_text()
          if '1ランは約10分を目標にしています。' in text:
              readme.write_text(text.replace('1ランは約10分を目標にしています。','1ランは約5分を目標にしています。',1))

          rt=Path('tests/runtime-contracts.test.ts'); text=rt.read_text()
          if 'close-camera avatar fallback' not in text:
              text += '\n\ntest("runtime exposes close-camera avatar fallback and shared contact grace", () => {\n  const runtime = readFileSync(new URL("../src/core/GameRuntime.ts", import.meta.url), "utf8");\n  const demo = readFileSync(new URL("../src/core/VoxelDemo.ts", import.meta.url), "utf8");\n  const enemies = readFileSync(new URL("../src/enemies/EnemyManager.ts", import.meta.url), "utf8");\n  assert.match(runtime, /cameraDistance/);\n  assert.match(demo, /cameraDistance >= 1\\.2/);\n  assert.match(enemies, /playerContactCooldown/);\n  assert.match(enemies, /1\\.35/);\n});\n'
              rt.write_text(text)

          gr=Path('tests/game-rules.test.ts'); text=gr.read_text()
          if 'maximum physical depth separately from pacing' not in text:
              text += '\n\ntest("RunDirector reports maximum physical depth separately from pacing", () => {\n  const director = new RunDirector();\n  director.reset("max-depth-display", "normal");\n  director.update(1, 0.83, 20);\n  assert.equal(director.snapshot.maxDepthPercent, 83);\n  assert.ok(director.snapshot.pace < director.snapshot.maxDepthPercent);\n});\n'
              gr.write_text(text)
          PY
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Tests
        run: bash scripts/run-tests.sh
      - name: Lint
        run: npm run lint
      - name: Commit improvement
        run: |
          git config user.name "yz4git"
          git config user.email "65384484+yz4git@users.noreply.github.com"
          git add src app README.md tests
          git diff --cached --check
          git commit -m "fix: polish five minute survival camera and results"
          git push origin HEAD:work/five-minute-visual-improve-20260830
